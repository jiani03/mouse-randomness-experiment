<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>鼠标随机性实验后台</title>
<style>
body{font-family:"Microsoft YaHei",Arial;margin:0;background:#f5f7fb;color:#1f2937}
header{background:#fff;padding:18px 30px;border-bottom:1px solid #ddd;display:flex;justify-content:space-between}
.container{max-width:1200px;margin:auto;padding:25px}
.card{background:#fff;border-radius:12px;padding:20px;margin-bottom:20px}
button{background:#2563eb;color:#fff;border:0;border-radius:8px;padding:9px 15px;cursor:pointer}
input{padding:10px;border:1px solid #ccc;border-radius:8px;width:260px;margin:5px}
table{width:100%;border-collapse:collapse;background:#fff}
th,td{padding:12px;border-bottom:1px solid #eee;text-align:left}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);padding:30px}
.modal-box{background:#fff;max-width:900px;margin:auto;padding:25px;border-radius:12px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.item{background:#f8fafc;padding:10px;border-radius:8px}
</style>
</head>
<body>

<div id="loginPage" class="container">
<div class="card">
<h2>实验后台登录</h2>
<input id="emailInput" placeholder="管理员邮箱"><br>
<input id="passwordInput" type="password" placeholder="管理员密码"><br>
<button id="loginButton">登录</button>
<p id="loginError"></p>
</div>
</div>

<div id="adminPage" style="display:none">
<header>
<h2>鼠标随机性实验后台</h2>
<button id="logoutButton">退出</button>
</header>

<div class="container">
<div class="card">
<h3>数据统计</h3>
<p>总被试数量：<span id="totalCount">0</span></p>
<p>平均总点击次数：<span id="avgCount">0</span></p>
</div>

<div class="card">
<input id="searchInput" placeholder="搜索 Participant ID">
<button id="exportButton">导出CSV</button>
</div>

<table>
<thead>
<tr>
<th>Participant ID</th>
<th>年龄</th>
<th>性别</th>
<th>阶段1点击</th>
<th>阶段2点击</th>
<th>完成时间</th>
<th>操作</th>
</tr>
</thead>
<tbody id="dataBody"></tbody>
</table>
</div>
</div>

<div id="detailModal" class="modal">
<div class="modal-box">
<button id="closeButton">关闭</button>
<div id="detailContent"></div>
</div>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import {getFirestore,collection,onSnapshot} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyCjuXIRHuHe31rr3ro8OfqEBJQSqo_Vwzw",
authDomain:"mouse-randomness-experiment.firebaseapp.com",
projectId:"mouse-randomness-experiment",
storageBucket:"mouse-randomness-experiment.firebasestorage.app",
messagingSenderId:"200186780535",
appId:"1:200186780535:web:e2fe9cb91015130a3e1f72"
};

const firebaseApp=initializeApp(firebaseConfig);
const auth=getAuth(firebaseApp);
const db=getFirestore(firebaseApp);

const loginPage=document.getElementById("loginPage");
const adminPage=document.getElementById("adminPage");
const loginButton=document.getElementById("loginButton");
const loginError=document.getElementById("loginError");
const logoutButton=document.getElementById("logoutButton");
const dataBody=document.getElementById("dataBody");

let experiments=[];

loginButton.addEventListener("click",async()=>{
    const email=document.getElementById("emailInput").value.trim();
    const password=document.getElementById("passwordInput").value;

    try{
        await signInWithEmailAndPassword(auth,email,password);
        loginPage.style.display="none";
        adminPage.style.display="block";
        loadData();
    }catch(e){
        console.error(e);
        loginError.innerText="邮箱或密码错误";
    }
});

logoutButton.addEventListener("click",()=>{
    signOut(auth).then(()=>location.reload());
});

function loadData(){
    onSnapshot(collection(db,"experiments"),snapshot=>{
        experiments=[];
        snapshot.forEach(doc=>{
            experiments.push({id:doc.id,...doc.data()});
        });
        render();
    });
}

function render(){
    dataBody.innerHTML="";
    let totalClicks=0;

    experiments.forEach(item=>{
        const s1=item.stage1?.clicks?.length||0;
        const s2=item.stage2?.clicks?.length||0;
        totalClicks+=s1+s2;

        const tr=document.createElement("tr");
        tr.innerHTML=`
        <td>${item.participantId||item.id}</td>
        <td>${item.personalInformation?.age||""}</td>
        <td>${item.personalInformation?.gender||""}</td>
        <td>${s1}</td>
        <td>${s2}</td>
        <td>${item.createdAt?.toDate?.()?.toLocaleString()||""}</td>
        <td><button class="viewBtn">查看</button></td>`;

        tr.querySelector(".viewBtn").onclick=()=>showDetail(item);
        dataBody.appendChild(tr);
    });

    document.getElementById("totalCount").innerText=experiments.length;
    document.getElementById("avgCount").innerText=
        experiments.length?Math.round(totalClicks/experiments.length):0;
}

function showDetail(item){
    document.getElementById("detailModal").style.display="block";

    document.getElementById("detailContent").innerHTML=`
    <h2>${item.participantId}</h2>
    <div class="grid">
    <div class="item">年龄:${item.personalInformation?.age||""}</div>
    <div class="item">性别:${item.personalInformation?.gender||""}</div>
    <div class="item">教育:${item.personalInformation?.education||""}</div>
    <div class="item">职业:${item.personalInformation?.occupation||""}</div>
    </div>
    <h3>阶段1点击序列</h3>
    <p>${(item.stage1?.clicks||[]).map(x=>x.target).join(" → ")}</p>
    <h3>阶段2点击序列</h3>
    <p>${(item.stage2?.clicks||[]).map(x=>x.target).join(" → ")}</p>`;
}

document.getElementById("closeButton").onclick=()=>{
    document.getElementById("detailModal").style.display="none";
};

document.getElementById("exportButton").onclick=()=>{
    let csv="Participant ID,Age,Gender,Stage1,Stage2\n";
    experiments.forEach(x=>{
        csv+=`${x.participantId},${x.personalInformation?.age||""},${x.personalInformation?.gender||""},${x.stage1?.clicks?.length||0},${x.stage2?.clicks?.length||0}\n`;
    });
    const blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="experiment_data.csv";
    a.click();
};
</script>
</body>
</html>
